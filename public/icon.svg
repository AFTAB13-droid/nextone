<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Top Plate Gradient -->
    <linearGradient id="plate-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Mid Plate Gradient -->
    <linearGradient id="mid-grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad-icon)" filter="url(#glow-icon)" />
  <!-- Inner Ring Highlight -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Multi-tier Isometric Layers (NextOne Core Emblem) -->
  <!-- Bottom Tier -->
  <path d="M18 41L32 48L46 41L32 34L18 41Z" fill="#312e81" opacity="0.7" />
  <path d="M18 41L32 48V45L18 38V41Z" fill="#1e1b4b" opacity="0.9" />
  <path d="M46 41L32 48V45L46 38V41Z" fill="#3730a3" opacity="0.9" />

  <!-- Middle Tier -->
  <path d="M18 32L32 39L46 32L32 25L18 32Z" fill="url(#mid-grad-icon)" opacity="0.9" />
  <path d="M18 32L32 39V36.5L18 29.5V32Z" fill="#6366f1" opacity="0.8" />
  <path d="M46 32L32 39V36.5L46 29.5V32Z" fill="#818cf8" opacity="0.8" />

  <!-- Top Hero Tier -->
  <path d="M18 23L32 30L46 23L32 16L18 23Z" fill="url(#plate-grad-icon)" />
  <path d="M18 23L32 30V27.5L18 20.5V23Z" fill="#c7d2fe" />
  <path d="M46 23L32 30V27.5L46 20.5V23Z" fill="#e0e7ff" />

  <!-- Center Quantum Beacon Dot -->
  <circle cx="32" cy="23" r="2.5" fill="#4f46e5" />
  <circle cx="32" cy="23" r="1.2" fill="#38bdf8" />

  <!-- Ambient Micro Star Flare -->
  <circle cx="47" cy="17" r="1.5" fill="#38bdf8" />
</svg>
